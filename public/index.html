<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message en direct</title>
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, sans-serif; color: #000000;
    transition: opacity 0.6s;
  }
  #texte {
    font-size: 2rem; text-align: center; padding: 1rem;
    opacity: 0; transition: opacity 0.4s;
    white-space: pre-wrap; word-break: break-word;
    color: #000000;
  }
  #texte.visible { opacity: 1; }
</style>
</head>
<body>
  <div id="texte">&nbsp;</div>

<script>
  const zone = document.getElementById("texte");
  let dernierTexte = "";

  async function lireEtat() {
    try {
      const r = await fetch("/api/etat", { cache: "no-store" });
      const data = await r.json();

      if (data.texte && data.reste > 0) {
        if (data.texte !== dernierTexte) {
          zone.textContent = data.texte;
          zone.classList.add("visible");
          dernierTexte = data.texte;
        }
        clearTimeout(zone._minuteur);
        zone._minuteur = setTimeout(() => {
          zone.classList.remove("visible");
          setTimeout(() => { zone.textContent = "\u00a0"; }, 600);
          dernierTexte = "";
        }, data.reste * 1000);
      }
    } catch (e) { /* serveur pas encore pret */ }
  }

  lireEtat();
  setInterval(lireEtat, 2000);
</script>
</body>
</html>
