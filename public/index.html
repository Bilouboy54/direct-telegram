<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message en direct</title>
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, sans-serif; color: #000000;
  }
  #texte {
    padding: 8px 14px;
    line-height: 1.4;
    width: 100%;
    max-height: 100%; overflow: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    opacity: 0; transition: opacity 0.4s;
    color: #000000;
  }
  #texte::-webkit-scrollbar { display: none; }
  #texte.visible { opacity: 1; }
  .ligne1 { font-size: 30px; text-align: center; }
  .ligne2 { font-size: 15px; text-align: left; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
  <div id="texte">&nbsp;</div>

<script>
(function () {
  "use strict";

  var OPTIONS = {
    endpoint: "/api/etat",
    intervalle: 500,
    fenetreRecent: 5000,
    delaiParent: 400
  };

  var zone = document.getElementById("texte");
  var arme = false;
  var dernierId = null;
  var dernierTexte = "";
  var parentPrevenu = false;

  function enMillisecondes(valeur) {
    if (valeur === undefined || valeur === null || valeur === "") return null;
    if (typeof valeur === "number") return valeur < 1e12 ? valeur * 1000 : valeur;
    var s = String(valeur).trim();
    if (/^\d+$/.test(s)) {
      var n = Number(s);
      return n < 1e12 ? n * 1000 : n;
    }
    var ms = Date.parse(s.replace(" ", "T"));
    return isNaN(ms) ? null : ms;
  }

  function estRecent(data) {
    var ms = enMillisecondes(data.date || data.timestamp || data.publie_le);
    if (ms === null) return false;
    var age = Date.now() - ms;
    if (age < 0) age = 0;
    return age <= OPTIONS.fenetreRecent;
  }

  function afficher(texte) {
    zone.textContent = "";
    String(texte).split(/\r?\n/).forEach(function (ligne, i) {
      var d = document.createElement("div");
      d.className = (i === 0) ? "ligne1" : "ligne2";
      d.textContent = ligne;
      zone.appendChild(d);
    });
    zone.classList.add("visible");
  }

  function prevenirParent() {
    if (parentPrevenu) return;
    parentPrevenu = true;
    try { window.parent.postMessage({ type: "contenu-pret" }, "*"); } catch (e) {}
  }

  async function lireEtat() {
    try {
      var r = await fetch(OPTIONS.endpoint, { cache: "no-store" });
      if (!r.ok) return;
      var data = await r.json();
      if (!data || typeof data !== "object") return;

      var texte = (typeof data.texte === "string") ? data.texte : "";
      var id = (data.id === undefined || data.id === null) ? null : String(data.id);

      if (!arme) {
        arme = true;
        dernierId = id;
        dernierTexte = texte;
        if (!texte || !estRecent(data)) return;
        afficher(texte);
        setTimeout(prevenirParent, OPTIONS.delaiParent);
        return;
      }

      var nouveau = id ? (id !== dernierId) : (texte !== dernierTexte && texte !== "");
      if (!texte || !nouveau) return;

      dernierId = id;
      dernierTexte = texte;
      afficher(texte);
      setTimeout(prevenirParent, OPTIONS.delaiParent);

    } catch (e) {}
  }

  lireEtat();
  setInterval(lireEtat, OPTIONS.intervalle);
})();
</script>
</body>
</html>
