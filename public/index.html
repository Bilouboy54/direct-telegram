<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message en direct</title>
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, sans-serif; color: #000000;
  }
  #texte {
    padding: 8px 14px;
    line-height: 1.4;
    width: 100%;
    max-height: 100%; overflow: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    opacity: 0; transition: opacity 0.4s;
    color: #000000;
    text-align: center;
  }
  #texte::-webkit-scrollbar { display: none; }
  #texte.visible { opacity: 1; }
  .ligne1 { font-size: 30px; }
  .ligne2 { font-size: 15px; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
  <div id="texte">&nbsp;</div>

<script>
  const zone = document.getElementById("texte");

  // Numero du dernier message deja vu par CE visiteur (memorise meme apres fermeture)
  let dejaVu = 0;
  try { dejaVu = Number(localStorage.getItem("direct_vu") || "0"); } catch (e) {}

  async function lireEtat() {
    try {
      const r = await fetch("/api/etat", { cache: "no-store" });
      const data = await r.json();

      // Affiche seulement si c'est un message que ce visiteur n'a JAMAIS vu
      if (data.texte && data.id && data.id !== dejaVu) {
        zone.innerHTML = "";
        const lignes = String(data.texte).split(/\r?\n/);
        lignes.forEach(function (l, i) {
          const d = document.createElement("div");
          d.className = (i === 0) ? "ligne1" : "ligne2";
          d.textContent = l;
          zone.appendChild(d);
        });
        zone.classList.add("visible");
        dejaVu = data.id;
        try { localStorage.setItem("direct_vu", String(data.id)); } catch (e) {}
      }
    } catch (e) { /* serveur pas encore pret */ }
  }

  lireEtat();
  setInterval(lireEtat, 2000);
</script>
</body>
</html>
