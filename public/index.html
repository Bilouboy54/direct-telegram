<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message en direct</title>
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; }
  body {
    display: flex; align-items: flex-start; justify-content: flex-start;
    font-family: system-ui, sans-serif; color: #000000;
  }
  #texte {
    font-size: 18px; text-align: left; padding: 1rem 1.2rem;
    line-height: 1.6;
    opacity: 0; transition: opacity 0.4s;
    white-space: pre-wrap; word-break: break-word;
    color: #000000;
  }
  #texte.visible { opacity: 1; }
</style>
</head>
<body>
  <div id="texte">&nbsp;</div>

<script>
  const zone = document.getElementById("texte");

  // Numero du dernier message deja vu par CE visiteur (memorise meme apres fermeture)
  let dejaVu = 0;
  try { dejaVu = Number(localStorage.getItem("direct_vu") || "0"); } catch (e) {}

  async function lireEtat() {
    try {
      const r = await fetch("/api/etat", { cache: "no-store" });
      const data = await r.json();

      // Affiche seulement si c'est un message que ce visiteur n'a JAMAIS vu
      if (data.texte && data.id && data.id !== dejaVu) {
        zone.textContent = data.texte;
        zone.classList.add("visible");
        dejaVu = data.id;
        try { localStorage.setItem("direct_vu", String(data.id)); } catch (e) {}
      }
    } catch (e) { /* serveur pas encore pret */ }
  }

  lireEtat();
  setInterval(lireEtat, 2000);
</script>
</body>
</html>
